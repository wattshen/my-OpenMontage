identity:
  name: "Whiteboard Explainer"
  category: whiteboard
  mood: warm, hand-taught, trustworthy, low-gloss
  pace: fast
  best_for: "Explainer/argument videos where a human voice walks the viewer through data — Douyin/TikTok knowledge content, teaching, analysis"
  # lineage: ported from OpenTake's whiteboard-explainer look (LemoLab-derived, MIT);
  # fonts Long Cang + Architects Daughter (SIL OFL 1.1). Kept as comment — schema identity is closed.

visual_language:
  color_palette:
    primary: ["#2A5CB3"]          # blue = measured/data ink
    accent: ["#D97757"]           # orange = emphasis marker
    background: "#FAF9F1"         # warm-white dry-erase board
    # surface/cards = #FFFFFF paper-white slips (schema palette is closed; see overlays.stat_card.bg)
    text: "#23262C"               # deep ink
    muted: "#6B7280"
  composition: centered cards on an open board; generous negative space; nothing edge-to-edge
  texture: dry-erase board — warm white, faint ghost scribbles (4-7% ink), slow window-light sheen; cards are flat white with soft shadow, no neon, no glow

typography:
  headings:
    font: "Long Cang"             # CJK handwriting; latin falls to Architects Daughter
    weight: 400                   # single-weight font; bold is synthesized by the browser
  body:
    font: "Architects Daughter"
    weight: 400
    line_height: 1.5
  code:
    font: "Architects Daughter"   # "handwritten fake terminal" is intentional aesthetic
  scale_system: "perfect_fourth"
  # Typography is enforced globally via themeConfig.fontOverride -> a single
  # `* { font-family: "Long Cang","Architects Daughter",cursive !important; }`
  # rule in Explainer, because components hardcode Inter/Space Grotesk inline.

motion:
  transitions: [wipe-left, zoom-in, morph, cut]
  animation_style: "spring(1, 80, 12), bouncy, overshooting"
  pacing_rules:
    min_scene_hold_seconds: 1.5
    max_scene_hold_seconds: 8
    text_card_hold_seconds: 2.5
    stat_card_hold_seconds: 2.0
    transition_duration_seconds: 0.3
  entrance: "scale-up with bounce (0.8 -> 1.05 -> 1.0)"
  exit: "scale-down-fade"

audio:
  voice_style: "energetic, conversational, slightly fast pace, Gen-Z friendly"
  music_mood: "lo-fi beat, electronic, driving rhythm"
  music_volume: 0.12
  sfx_style: "soft marker taps, paper swipes — keep quiet, the voice leads"
  ducking_threshold_db: -4

overlays:
  stat_card:
    bg: "#FFFFFF"
    border: "#2A5CB3"
    radius: 12
    shadow: "0 12px 40px rgba(35,38,44,0.10)"
  key_term:
    bg: "#FDF3EC"
    text: "#B4552F"
    radius: 6
  code_block:
    bg: "#F1F0E8"
    text: "#23262C"
    highlight: "#2A5CB3"

asset_generation:
  image_prompt_prefix: "minimal hand-drawn whiteboard sketch, thin ink lines, muted blue and orange marker, warm white background, "
  image_negative_prompt: "photorealistic, neon, dark background, gradient, 3d render, glossy"
  diagram_style: "hand-drawn boxes with rounded corners, marker arrows, ink on warm white"
  consistency_anchors:
    - "Blue (#2A5CB3) as primary data ink throughout"
    - "Orange (#D97757) reserved for emphasis only"
    - "Warm-white board (#FAF9F1) backgrounds in all scenes"
    - "Flat white cards with soft shadow, never glowing"

density:
  min_elements_per_scene: 2
  max_static_seconds: 3
  required_visual_variety: true
  min_charts_per_video: 2
  overlay_coverage_pct: 30
  max_consecutive_text_cards: 1
  preferred_scene_types:
    - text_card
    - stat_card
    - comparison
    - bar_chart
    - callout
    - diagram
    - progress_bar
  overlay_types:
    - section_title
    - stat_reveal
    - hero_title

quality_rules:
  - "Minimum contrast ratio 4.5:1 for all text (ink #23262C on board #FAF9F1 = 13:1)"
  - "Maximum 4 colors on screen (board counts as one)"
  - "Handwriting must stay legible: no text under 34px at 1080-wide"
  - "Ghost scribbles stay under 8% opacity — texture, not content"
  - "Every scene has at least one animated element"
  - "Every scene has at least 2 visual elements (primary + overlay/decor)"
  - "No 3+ seconds without a new visual element appearing"

chart_palette:
  - "#2A5CB3"
  - "#D97757"
  - "#3E7C59"
  - "#B4402F"
  - "#2F7E8C"
  - "#C08A2E"

color_rules:
  harmony_type: "split-complementary"   # blue/orange
  contrast_validation: true
  colorblind_safe: true
